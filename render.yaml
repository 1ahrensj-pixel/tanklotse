# PR #14 Staging-Preview im Mock-Modus. Plattform: Render.
# Aufruf: in Render Dashboard "New Blueprint" mit diesem Repo +
# Branch `deploy/staging-preview-mock`.
#
# Wichtig: alle Secret-ENV-Variablen werden per Render-Panel gesetzt
# (sync=false), niemals in dieser YAML committed.

services:
  - type: web
    name: tanklotse-backend-staging
    plan: starter
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    branch: deploy/staging-preview-mock
    envVars:
      # --- Mock-Modus (PR #14) ---
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: "3000"
      - key: APP_NAME
        value: TankLotse
      - key: APP_ENV
        value: staging-preview
      # Provider-Modi: alle Mock/Disabled — keine externen Calls.
      - key: FUEL_PROVIDER
        value: tankerkoenig
      - key: FUEL_PROVIDER_MODE
        value: mock
      - key: ROUTING_PROVIDER
        value: mapbox
      - key: ROUTING_PROVIDER_MODE
        value: mock
      - key: ROUTING_ENABLED
        value: "true"
      - key: GEOCODER_PROVIDER
        value: nominatim
      - key: GEOCODER_PROVIDER_MODE
        value: mock
      - key: PUSH_PROVIDER
        value: firebase
      - key: PUSH_PROVIDER_MODE
        value: disabled
      - key: AUTH_PROVIDER_MODE
        value: disabled
      - key: PAYMENT_PROVIDER_MODE
        value: disabled
      - key: ALLOW_MOCK_PROVIDERS_IN_PRODUCTION
        value: "false"
      # Routing-Cost-Controls: Mock liefert ohnehin keinen API-Verkehr.
      - key: ROUTING_MAX_CANDIDATES
        value: "10"
      - key: ROUTING_CONCURRENCY
        value: "4"
      - key: MAPBOX_TIMEOUT_MS
        value: "4000"
      - key: MAPBOX_CACHE_TTL_S
        value: "1800"
      - key: MAPBOX_DAILY_REQUEST_LIMIT
        value: "1000"
      - key: MAPBOX_WARN_REQUESTS_PER_HOUR
        value: "200"
      # Datenbank + Redis: Render-managed Services (s.u.).
      - key: DATABASE_URL
        fromDatabase:
          name: tanklotse-postgres-staging
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: tanklotse-redis-staging
          type: redis
          property: connectionString
      # Secrets: Operator setzt im Panel, sync=false → niemals in YAML/git.
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: "900"
      - key: JWT_REFRESH_TTL
        value: "2592000"
      # CORS auf zukuenftige Frontend-URLs — Operator passt nach Vercel-Deploy an.
      - key: CORS_ORIGINS
        sync: false
      # Nominatim-Pflicht-Header.
      - key: NOMINATIM_USER_AGENT
        value: "TankLotse-Staging-Preview/1.0 (+https://github.com/1ahrensj-pixel/tankengpt)"

  # ---------------------------------------------------------------------------
  # Landingpage (Next.js standalone, Docker).
  # WICHTIG: NEXT_PUBLIC_* wird zur BUILD-Zeit eingebacken — die Dockerfiles
  # deklarieren passende ARGs, Render reicht envVars als Build-Args durch.
  # ---------------------------------------------------------------------------
  - type: web
    name: tanklotse-landing-staging
    plan: starter
    runtime: docker
    dockerfilePath: ./landingpage/Dockerfile
    dockerContext: ./landingpage
    healthCheckPath: /
    autoDeploy: true
    branch: deploy/staging-preview-mock
    envVars:
      - key: NEXT_PUBLIC_SITE_URL
        sync: false # z. B. https://tanklotse-landing-staging.onrender.com
      - key: NEXT_PUBLIC_SUPPORT_EMAIL
        value: support@tanklotse.de

  # ---------------------------------------------------------------------------
  # Admin-Dashboard (Next.js standalone, Docker).
  # NEXT_PUBLIC_API_URL MUSS auf die Backend-URL zeigen — sie steuert
  # API-Basis UND CSP connect-src. Ohne sie ist der Admin-Login tot
  # (Red-Team-Befund: CSP blockte alle API-Calls).
  # ---------------------------------------------------------------------------
  - type: web
    name: tanklotse-admin-staging
    plan: starter
    runtime: docker
    dockerfilePath: ./admin-dashboard/Dockerfile
    dockerContext: ./admin-dashboard
    healthCheckPath: /login
    autoDeploy: true
    branch: deploy/staging-preview-mock
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false # z. B. https://tanklotse-backend-staging.onrender.com

databases:
  - name: tanklotse-postgres-staging
    plan: starter
    databaseName: tanklotse_staging
    user: tanklotse

  - name: tanklotse-redis-staging
    type: redis
    plan: starter
    ipAllowList: []
