# =============================================================================
# TankLotse — Production-Blueprint (Render)
# =============================================================================
# Branch: main. Echte Spritpreise (Tankerkoenig live), Resend-Mail.
# Secrets (sync:false) werden per Render-Panel / API gesetzt — nie in git.
# =============================================================================

services:
  - type: web
    name: tanklotse-backend
    plan: starter
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: APP_NAME
        value: TankLotse
      - key: APP_ENV
        value: production
      # --- Provider: ECHTE Spritpreise, kostenloser Geocoder, Rest aus ---
      - key: FUEL_PROVIDER
        value: tankerkoenig
      - key: FUEL_PROVIDER_MODE
        value: live
      - key: TANKERKOENIG_BASE_URL
        value: https://creativecommons.tankerkoenig.de/json
      - key: TANKERKOENIG_API_KEY
        sync: false
      - key: GEOCODER_PROVIDER
        value: nominatim
      - key: GEOCODER_PROVIDER_MODE
        value: live
      - key: NOMINATIM_BASE_URL
        value: https://nominatim.openstreetmap.org
      - key: NOMINATIM_USER_AGENT
        value: "TankLotse/1.0 (+https://tanklotse-landing.onrender.com)"
      - key: GEOCODER_BASE_URL
        value: https://nominatim.openstreetmap.org
      - key: GEOCODER_USER_AGENT
        value: "TankLotse/1.0 (+https://tanklotse-landing.onrender.com)"
      - key: ROUTING_ENABLED
        value: "false"
      - key: ROUTING_PROVIDER
        value: noop
      - key: ROUTING_PROVIDER_MODE
        value: disabled
      - key: PUSH_ENABLED
        value: "false"
      - key: PUSH_PROVIDER_MODE
        value: disabled
      - key: AUTH_PROVIDER_MODE
        value: disabled
      - key: PAYMENT_PROVIDER_MODE
        value: disabled
      - key: SUBSCRIPTIONS_ENABLED
        value: "false"
      - key: SUBSCRIPTION_PROVIDER
        value: none
      - key: ALLOW_MOCK_PROVIDERS_IN_PRODUCTION
        value: "false"
      # --- DB + Cache (Render-managed) ---
      - key: DATABASE_URL
        fromDatabase:
          name: tanklotse-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: tanklotse-redis
          type: redis
          property: connectionString
      # --- Auth-Secrets (sync:false → per API gesetzt) ---
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: "900"
      - key: JWT_REFRESH_TTL
        value: "2592000"
      - key: CORS_ORIGINS
        sync: false
      # --- Mail (Resend) ---
      - key: SMTP_ENABLED
        value: "true"
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: resend
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: onboarding@resend.dev
      - key: SMTP_FROM
        value: "TankLotse <onboarding@resend.dev>"
      # --- Admin-Seed (sync:false) ---
      - key: ADMIN_SEED_EMAIL
        value: info@ahrens-re.de
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: SWAGGER_ENABLED
        value: "false"

  - type: web
    name: tanklotse-landing
    plan: starter
    runtime: docker
    dockerfilePath: ./landingpage/Dockerfile
    dockerContext: ./landingpage
    healthCheckPath: /
    autoDeploy: true
    branch: main
    envVars:
      - key: NEXT_PUBLIC_SITE_URL
        value: https://tanklotse-landing.onrender.com
      - key: NEXT_PUBLIC_SUPPORT_EMAIL
        value: info@ahrens-re.de

  - type: web
    name: tanklotse-admin
    plan: starter
    runtime: docker
    dockerfilePath: ./admin-dashboard/Dockerfile
    dockerContext: ./admin-dashboard
    healthCheckPath: /login
    autoDeploy: true
    branch: main
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://tanklotse-backend.onrender.com

databases:
  - name: tanklotse-postgres
    plan: starter
    databaseName: tanklotse
    user: tanklotse
    postgresMajorVersion: "16"

  - name: tanklotse-redis
    type: redis
    plan: starter
    ipAllowList: []
