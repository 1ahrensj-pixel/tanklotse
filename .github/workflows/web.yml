name: web

on:
  push:
    paths:
      - 'admin-dashboard/**'
      - 'landingpage/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'admin-dashboard/**'
      - 'landingpage/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [admin-dashboard, landingpage]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - working-directory: ${{ matrix.package }}
        run: npm ci
      - name: Lint (ESLint via Flat-Config)
        working-directory: ${{ matrix.package }}
        run: npm run lint
      - working-directory: ${{ matrix.package }}
        run: npm run build
