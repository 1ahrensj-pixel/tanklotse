name: staging-live-smoke

# Audit 2026-05-06 §22 Phase 6 + §16: Live-Smoke verbraucht API-Kontingent
# (Tankerkoenig Free-Tier + Mapbox Free-Tier). Deshalb NUR manuell triggerbar
# via `workflow_dispatch`. Nicht auf push/pull_request — sonst laufen Live-
# Smokes bei jedem Commit und produzieren Kosten.
#
# Voraussetzung: GitHub-Secrets `TANKERKOENIG_API_KEY` und
# `MAPBOX_ACCESS_TOKEN` sind eingerichtet.
#
# Audit §10 Aufgabe 4 — Secret-Leak-Schutz:
#   * Schritte echo'en NUR fixe Texte (z.B. "secret fehlt"), niemals den
#     Token-Inhalt selbst.
#   * KEIN `printenv`, KEIN `env`-Dump, KEIN `cat .env*`.
#   * GitHub Actions maskiert konfigurierte Secrets automatisch im Log-Output.
#   * Backend-seitig redactiert `MapboxRoutingDistanceService` per
#     `redactMapboxToken()` jeden `access_token=...`-Substring aus
#     Error-Messages, falls fetch ihn ins Error mitgeben sollte.

on:
  workflow_dispatch:
    inputs:
      run_tankerkoenig:
        description: 'Tankerkoenig live-smoke ausfuehren'
        type: boolean
        default: true
      run_mapbox:
        description: 'Mapbox routing live-smoke ausfuehren'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  staging-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Tankerkoenig live smoke
        if: ${{ inputs.run_tankerkoenig }}
        working-directory: backend
        env:
          NODE_ENV: staging
          TANKERKOENIG_API_KEY: ${{ secrets.TANKERKOENIG_API_KEY }}
        run: |
          if [ -z "${TANKERKOENIG_API_KEY}" ]; then
            echo "::error::TANKERKOENIG_API_KEY secret fehlt — Smoke kann nicht laufen."
            exit 1
          fi
          npm run smoke:tankerkoenig:live

      - name: Mapbox routing live smoke
        if: ${{ inputs.run_mapbox }}
        working-directory: backend
        env:
          NODE_ENV: staging
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          # Lassen Provider-Strict-Pfad in RoutingModule aus dem Bootstrap raus —
          # die Smoke-Scripts instanziieren MapboxRoutingDistanceService direkt.
        run: |
          if [ -z "${MAPBOX_ACCESS_TOKEN}" ]; then
            echo "::error::MAPBOX_ACCESS_TOKEN secret fehlt — Smoke kann nicht laufen."
            exit 1
          fi
          npm run smoke:mapbox:routing
