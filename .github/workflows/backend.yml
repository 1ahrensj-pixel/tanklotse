name: backend

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: tanklotse
          POSTGRES_PASSWORD: tanklotse
          POSTGRES_DB: tanklotse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://tanklotse:tanklotse@localhost:5432/tanklotse_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test-access-secret-must-be-32-chars-aaaa
      JWT_REFRESH_SECRET: test-refresh-secret-must-be-32-chars-aaa
      COOKIE_SECRET: test-cookie-secret-must-be-32-chars-aaaaa
      JWT_ACCESS_TTL: 900
      JWT_REFRESH_TTL: 2592000
      FUEL_PROVIDER: mock
      TANKERKOENIG_BASE_URL: https://example.invalid

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npx prisma generate
      - working-directory: backend
        run: npx prisma migrate deploy
      - working-directory: backend
        run: npm run lint
      - working-directory: backend
        run: npm test
      # Audit §22 Phase 8 / PR #12 Phase 2: Vertrags-Tests gegen die in
      # `backend/test/fixtures/` gespeicherten Provider-Antworten — laufen
      # ohne echte API-Keys, schlagen Alarm, wenn ein Provider sein
      # Schema aendert.
      - working-directory: backend
        run: npm run test:contract
      # PR #12 Phase 2: Provider-Readiness CLI in CI sichtbar — meldet
      # missing_config / blocked_in_production / not_implemented mit
      # Exit-Code != 0. In CI laufen wir mit FUEL_PROVIDER_MODE=mock +
      # ALLOW_MOCK_PROVIDERS_IN_PRODUCTION=true (NODE_ENV=test), damit
      # der Lauf den klar dokumentierten Mock-CI-Pfad zeigt.
      - working-directory: backend
        env:
          FUEL_PROVIDER_MODE: mock
          ROUTING_PROVIDER_MODE: mock
          GEOCODER_PROVIDER_MODE: mock
        run: npm run providers:check
      - working-directory: backend
        run: npm run build
      - working-directory: backend
        run: npx prisma validate
