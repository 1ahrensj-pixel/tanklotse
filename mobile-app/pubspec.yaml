name: tanklotse
description: TankLotse — Sprit-Entscheidungsassistent für Deutschland.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_svg: ^2.0.10+1
  collection: ^1.18.0
  package_info_plus: ^8.0.2
  connectivity_plus: ^6.0.3
  sentry_flutter: ^8.3.0

  # Karten
  mapbox_maps_flutter: ^2.5.0

  # Authentifizierung
  sign_in_with_apple: ^6.1.4
  google_sign_in: ^6.2.2

  # Push
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

  # In-App-Purchase
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
