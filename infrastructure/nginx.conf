user  nginx;
worker_processes  auto;
events { worker_connections  1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Tarpit-/Limit-Sicht: kein Server-Banner
  server_tokens off;

  upstream backend_upstream { server backend:3000; }
  upstream landing_upstream { server landingpage:3001; }
  upstream admin_upstream { server admin:3002; }

  # tanklotse.de → Landingpage
  server {
    listen 80;
    server_name tanklotse.de www.tanklotse.de _;

    location ~ ^/api/ {
      proxy_pass http://backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(health|ready|docs)/?$ {
      proxy_pass http://backend_upstream;
    }

    location / {
      proxy_pass http://landing_upstream;
      proxy_set_header Host $host;
    }
  }

  # admin.tanklotse.de → Admin-Dashboard
  server {
    listen 80;
    server_name admin.tanklotse.de;

    location / {
      proxy_pass http://admin_upstream;
      proxy_set_header Host $host;
    }
  }
}
